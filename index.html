<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ncnn webassembly nanodet</title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }
        #app {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }
        #controls {
            position: absolute;
            z-index: 1;
            top: 12px;
            top: max(12px, env(safe-area-inset-top));
            left: 12px;
            left: max(12px, env(safe-area-inset-left));
            right: 12px;
            right: max(12px, env(safe-area-inset-right));
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            color: white;
            text-shadow: 0 1px 3px black;
            pointer-events: none;
        }
        #controls h1 {
            margin: 0;
            font-size: 16px;
        }
        #controls button {
            min-height: 48px;
            pointer-events: auto;
        }
        #fullscreen-status {
            flex-basis: 100%;
            font-size: 14px;
        }
        video {
            /* Keep the source video rendered for Safari camera frames (see issue #17). */
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            /* Crop the complete inference image, including boxes, without distortion. */
            object-fit: cover;
            object-position: center;
        }
    </style>

</head>

<body>
    <div id="app">
        <div id="controls">
            <h1>ncnn webassembly nanodet</h1>
            <button disabled id="switch-camera-btn">Switch Camera</button>
            <button id="fullscreen-btn" aria-pressed="false">全屏显示</button>
            <span id="fullscreen-status" role="status"></span>
        </div>
        <canvas id="canvas" width="640"></canvas>
        <video id="video" playsinline autoplay muted></video>
    </div>

    <script src="wasmFeatureDetect.js"></script>

    <script type='text/javascript'>
        var Module = {};

        var has_simd;
        var has_threads;

        var wasmModuleLoaded = false;
        var wasmModuleLoadedCallbacks = [];

        Module.onRuntimeInitialized = function() {
            wasmModuleLoaded = true;
            for (var i = 0; i < wasmModuleLoadedCallbacks.length; i++) {
                wasmModuleLoadedCallbacks[i]();
            }
        };

        (async function() {
            has_simd = await wasmFeatureDetect.simd();
            has_threads = window.crossOriginIsolated === true && await wasmFeatureDetect.threads();
            var feature = has_simd ? 'simd' : 'basic';
            if (has_threads) feature = has_simd ? 'simd-threads' : 'threads';

            // Shared memory64 is a separate capability from ordinary memory64.
            var use_wasm64 = await wasmFeatureDetect.memory64(has_threads);
            async function fetchBinary(name) {
                var response = await fetch(name + '.wasm');
                if (!response.ok) throw new Error('Unable to load ' + name + ': HTTP ' + response.status);
                return response.arrayBuffer();
            }

            nanodet_module_name = 'nanodet-' + (use_wasm64 ? 'wasm64-' : '') + feature;
            var buffer = await fetchBinary(nanodet_module_name);
            // Verify the complete binary before loading any JS/global state.
            // A small capability probe cannot cover every emitted instruction.
            if (use_wasm64 && !WebAssembly.validate(buffer)) {
                nanodet_module_name = 'nanodet-' + feature;
                buffer = await fetchBinary(nanodet_module_name);
            }
            if (!WebAssembly.validate(buffer)) throw new Error('Unsupported WebAssembly module: ' + nanodet_module_name);

            console.log('load ' + nanodet_module_name);
            Module.wasmBinary = buffer;
            var script = document.createElement('script');
            script.src = nanodet_module_name + '.js';
            script.onload = function() { console.log('Emscripten boilerplate loaded.'); };
            script.onerror = function() { console.error('Unable to load ' + script.src); };
            document.body.appendChild(script);
        })().catch(function(error) {
            // Network/runtime failures are not mistaken for missing memory64 support.
            console.error(error);
        });

        var shouldFaceUser = true;
        var stream = null;
        // Match NanoDet::target_size; do not scale inference with screen pixels or DPR.
        var inputLongEdge = 416;
        var animationFrame = null;

        var dst = null;
        var resultarray = null;
        var resultbuffer = null;
        window.addEventListener('DOMContentLoaded', function() {
            switchcamerabtn = document.getElementById('switch-camera-btn');
            video = document.getElementById('video');
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d');

            // A single frame chain survives camera switches without duplicate inference.
            video.addEventListener('play', scheduleFrame);
            video.addEventListener('canplay', scheduleFrame);
            if (wasmModuleLoaded) scheduleFrame();
            else wasmModuleLoadedCallbacks.push(scheduleFrame);

            var app = document.getElementById('app');
            var fullscreenButton = document.getElementById('fullscreen-btn');
            var fullscreenStatus = document.getElementById('fullscreen-status');
            if (!app.requestFullscreen || !document.fullscreenEnabled) {
                fullscreenButton.disabled = true;
                fullscreenStatus.textContent = '当前浏览器不支持页面全屏，画面仍会适配可用窗口。';
            }
            fullscreenButton.addEventListener('click', async function() {
                fullscreenStatus.textContent = '';
                try {
                    if (document.fullscreenElement) await document.exitFullscreen();
                    else await app.requestFullscreen();
                } catch (err) {
                    console.error('Unable to change fullscreen mode:', err);
                    fullscreenStatus.textContent = '无法切换全屏：' + err.message;
                }
            });
            document.addEventListener('fullscreenchange', function() {
                var active = document.fullscreenElement === app;
                fullscreenButton.textContent = active ? '退出全屏' : '全屏显示';
                fullscreenButton.setAttribute('aria-pressed', String(active));
                scheduleFrame();
            });
            window.addEventListener('resize', scheduleFrame);
            if (window.visualViewport) window.visualViewport.addEventListener('resize', scheduleFrame);

            // check whether we can use facingMode
            var supports = navigator.mediaDevices.getSupportedConstraints();
            if (supports['facingMode'] === true) {
                switchcamerabtn.disabled = false;
            }

            switchcamerabtn.addEventListener('click', function() {
                if (stream == null)
                    return

                stream.getTracks().forEach(t => {
                    t.stop();
                });

                shouldFaceUser = !shouldFaceUser;
                capture();
            });

            capture();
        });

        function capture() {
            var constraints = { audio: false, video: { width: 640, height: 480, facingMode: shouldFaceUser ? 'user' : 'environment' } };
            navigator.mediaDevices.getUserMedia(constraints)
                .then(function(mediaStream) {
                    var video = document.querySelector('video');
                    stream = mediaStream;
                    video.srcObject = mediaStream;
                    video.onloadedmetadata = function(e) {
                        video.play().catch(function(err) {
                            console.error('Unable to start camera playback:', err);
                        });
                    };
                })
                .catch(function(err) {
                    console.log(err.message);
                });
        }


        function ncnn_nanodet() {
            var canvas = document.getElementById('canvas');
            var ctx = canvas.getContext('2d');

            var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            var data = imageData.data;

            Module.HEAPU8.set(data, dst);

            Module._nanodet_ncnn(dst, canvas.width, canvas.height);

            var result = Module.HEAPU8.subarray(dst, dst + data.length);
            imageData.data.set(result);
            ctx.putImageData(imageData, 0, 0);
        }

        function scheduleFrame() {
            if (animationFrame === null) animationFrame = window.requestAnimationFrame(sFilter);
        }

        // Crop before inference, so only the viewport's field of view is processed.
        function frameGeometry(sourceWidth, sourceHeight, viewportWidth, viewportHeight) {
            if (sourceWidth <= 0 || sourceHeight <= 0 || viewportWidth <= 0 || viewportHeight <= 0) return null;
            var aspect = viewportWidth / viewportHeight;
            var width = aspect >= 1 ? inputLongEdge : Math.max(1, Math.round(inputLongEdge * aspect));
            var height = aspect >= 1 ? Math.max(1, Math.round(inputLongEdge / aspect)) : inputLongEdge;
            // Use the integer input aspect for a distortion-free source-to-input mapping.
            var inputAspect = width / height;
            var cropWidth = Math.min(sourceWidth, sourceHeight * inputAspect);
            var cropHeight = cropWidth / inputAspect;
            return {
                x: (sourceWidth - cropWidth) / 2,
                y: (sourceHeight - cropHeight) / 2,
                width: cropWidth, height: cropHeight,
                inputWidth: width, inputHeight: height
            };
        }

        var sFilter = function() {
            animationFrame = null;
            if (video.paused || video.ended || !wasmModuleLoaded) return;
            var app = document.getElementById('app');
            var geometry = frameGeometry(video.videoWidth, video.videoHeight, app.clientWidth, app.clientHeight);
            if (!geometry || video.readyState < 2) {
                scheduleFrame();
                return;
            }

            if (dst === null || canvas.width !== geometry.inputWidth || canvas.height !== geometry.inputHeight) {
                var next = Module._malloc(geometry.inputWidth * geometry.inputHeight * 4);
                if (!next) {
                    console.error('Unable to allocate camera frame buffer');
                    return;
                }
                if (dst !== null) Module._free(dst);
                dst = next;
                canvas.width = geometry.inputWidth;
                canvas.height = geometry.inputHeight;
            }

            ctx.drawImage(video, geometry.x, geometry.y, geometry.width, geometry.height,
                          0, 0, canvas.width, canvas.height);
            ncnn_nanodet();
            scheduleFrame();
        };

    </script>

</body>

</html>
