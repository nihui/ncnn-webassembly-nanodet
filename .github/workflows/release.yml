name: build-and-deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  EMSCRIPTEN_VERSION: 6.0.12
  NCNN_VERSION: 20261020

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: emsdk
      run: |
        git clone --depth 1 https://github.com/emscripten-core/emsdk.git
        emsdk/emsdk install "$EMSCRIPTEN_VERSION"
        emsdk/emsdk activate "$EMSCRIPTEN_VERSION"
    - name: ncnn prebuilt SDK
      run: |
        curl --fail --location --retry 3 -o ncnn.zip "https://github.com/Tencent/ncnn/releases/download/${NCNN_VERSION}/ncnn-${NCNN_VERSION}-webassembly.zip"
        unzip -q ncnn.zip
    - name: Build all four variants
      run: |
        source emsdk/emsdk_env.sh
        for feature in basic simd threads simd-threads; do
          emcmake cmake -S . -B "build/$feature" -DWASM_FEATURE="$feature"
          cmake --build "build/$feature" --parallel 4
        done
    - name: Collect deploy files
      run: |
        mkdir deploy
        cp build/*/*.data build/*/*.js build/*/*.wasm deploy/
        cp index.html wasmFeatureDetect.js deploy/
    - name: Upload site
      uses: actions/upload-artifact@v4
      with:
        name: site
        path: deploy

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: site
        path: deploy
    - name: deploy
      uses: JamesIves/github-pages-deploy-action@4.1.1
      with:
        branch: gh-pages
        folder: deploy
        single-commit: true
